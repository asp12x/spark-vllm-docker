# Recipe: GLM-4.7-Flash NVFP4 — SOLO / single GB10 — BAKE-OFF BASELINE (no speculative decoding)
#
# PURPOSE. Challenger to muse-glimmer-30b for the CODER lane. Not a prod-main candidate:
# GLM-4.7-Flash is Glm4MoeLiteForCausalLM with NO vision_config (verified in the checkpoint
# config 2026-09-18) — promoting it to :8000 would kill main-model vision, which seeimage /
# video-frames / beadpattern / render-QA all depend on.
#
# SERVING POSTURE IS DELIBERATELY COPIED FROM muse-glimmer-30b-solo.yaml so the speed numbers
# are comparable: util 0.50, 131072 ctx, 32 seqs, 8192 batched tokens, chunked prefill,
# prefix caching. Do not "optimize" this recipe — the whole point is same-posture comparison.
#
# THE QUANT IS THIRD-PARTY AND UNVALIDATED (same caveat class as RedHatAI's Muse NVFP4).
# GadflyII/GLM-4.7-Flash-NVFP4, compressed-tensors nvfp4-pack-quantized, W4A4 (weights AND
# activations 4-bit, group 16, dynamic activations). EXCLUDED from quantization: lm_head,
# embeddings, MoE gate, and ALL self_attn. ~20.4 GB over 4 shards. No accuracy-recovery
# numbers published. 7.7k downloads, last touched 2026-01-20.
#
# EOS WATCH — READ THIS BEFORE DEBUGGING TOOL CALLS.
# generation_config.json lists eos_token_id [154820, 154827, 154829] — THREE tokens. This is
# exactly the shape of the Muse 200008 defect, where a CHANNEL terminator sat in the EOS set
# and vLLM stopped generation at the end of the reasoning segment, so the model never reached
# its tool-call channel (0 tool calls, finish=stop). If the 40-probe tool gate comes back at or
# near 0/40, DO NOT conclude "GLM can't tool-call" — first re-run with the extra EOS ids removed
# and compare. Left at vendor default here on purpose so the failure, if any, is attributable.
#
# SAMPLING: vendor default via --generation-config auto (the card ships temperature 1.0 and
# nothing else). No override — official-params discipline; we are measuring the model Z.ai
# shipped, not a tuned variant.
recipe_version: "1"
name: GLM-4.7-Flash-NVFP4-Eval
description: Bake-off challenger. GLM-4.7-Flash 30B-A3B NVFP4 W4A4, text-only, 131072 ctx, no speculative decoding (clean baseline).
model: GadflyII/GLM-4.7-Flash-NVFP4
container: eugr/spark-vllm:20260911-adopted
cluster_only: false
solo_only: true
defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  gpu_memory_utilization: 0.50
  max_model_len: 131072
  max_num_seqs: 32
  max_num_batched_tokens: 8192
  served_model_name: glm47f-eval
env:
command: |
  vllm serve GadflyII/GLM-4.7-Flash-NVFP4 \
    --served-model-name {served_model_name} \
    --host {host} \
    --port {port} \
    --tensor-parallel-size {tensor_parallel} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --enable-chunked-prefill \
    --enable-prefix-caching \
    --generation-config auto \
    --reasoning-parser glm45 \
    --tool-call-parser glm47 \
    --enable-auto-tool-choice
