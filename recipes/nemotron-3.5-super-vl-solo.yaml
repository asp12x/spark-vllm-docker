#             (TTFT 10.7 vs 6.9 s, but 164 vs 276 generated tokens per turn); c=3 aggregate 44 tok/s; c=4 stress
#             8192->512: 32 tok/s, TTFT 15.4 s, TPOT 89 ms, 0 preemptions.
