# Nemotron 3.5 Super VL 120B-A12B NVFP4 -- EVAL recipe (bake-off vs muse-glimmer-30b, 2026-10-17).
# Released 2026-10-15 (nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4, HF sha 59b87216).
# Arch NemotronH_Omni_Reasoning_V3 (nemotron_h_omni): Mamba-2 + MoE (512 experts, 12B active)
# + C-RADIO vision tower (BF16). vision_config PRESENT -> eligible for prod-main (vision gate).
# Needs vLLM >= 0.31 (day-0 support 2026-10-15); prod image 20260911-adopted is too old.
# Serve flags = the model card DGX Spark command (LiLiCorr DFlash drafter, 7 spec tokens,
# util 0.75, max_num_seqs 1, batched 8192, parsers nemotron_v3 / qwen3_coder). Only additions:
# an explicit max-model-len (vllm recipe table lists 114688 for 1x DGX Spark) and the
# served-model-name nemotron-3.5-super-vl-eval (no substring relation to any prod id).
# hf_quant_config carries calibrated FP8 KV scales; kv dtype left to engine auto-detect for
# the first boot (the card omits the flag) -- check the load log for the KV dtype it chose.
recipe_version: "1"
name: Nemotron-3.5-Super-VL-120B-NVFP4-Eval
description: Single-Spark vLLM serving of Nemotron 3.5 Super VL 120B-A12B NVFP4 with LiLiCorr DFlash drafter (bake-off eval)
model: /root/.cache/huggingface/hub/models--nvidia--NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4/snapshots/59b8721646c38111a242da18218859fb2b454322
container: eugr/spark-vllm:nightly-20261016
cluster_only: false
solo_only: true
defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  gpu_memory_utilization: 0.75
  max_model_len: 114688
  max_num_seqs: 1
  max_num_batched_tokens: 8192
command: |
  vllm serve /root/.cache/huggingface/hub/models--nvidia--NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4/snapshots/59b8721646c38111a242da18218859fb2b454322 \
    --served-model-name nemotron-3.5-super-vl-eval \
    --host {host} \
    --port {port} \
    --tensor-parallel-size {tensor_parallel} \
    --trust-remote-code \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --speculative_config.method dflash \
    --speculative_config.model /root/.cache/huggingface/hub/models--nvidia--NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4-LiLiCorr/snapshots/292bf1efc06ba39567da7351f2ad7a522afa3959 \
    --speculative_config.num_speculative_tokens 7 \
    --mamba-backend flashinfer \
    --mamba-ssm-cache-dtype float16 \
    --enable-mamba-cache-stochastic-rounding \
    --mamba-cache-philox-rounds 5 \
    --enable-mamba-shared-prefix-checkpoint \
    --video-pruning-rate 0.5 \
    --media-io-kwargs '{{"video": {{"fps": 2, "num_frames": 256}}}}' \
    --block-size 64 \
    --prefix-match-unit 64 \
    --enable-auto-tool-choice \
    --tool-call-parser qwen3_coder \
    --reasoning-parser nemotron_v3
