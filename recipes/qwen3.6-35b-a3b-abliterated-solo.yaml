# Recipe: Qwen3.6-35B-A3B-ABLITERATED-NVFP4-Solo  (UNCENSORED escape hatch)
# Clone of qwen3.6-35b-a3b-nvfp4-solo.yaml with the model swapped and MTP REMOVED.
#
# REMOVING MTP IS MANDATORY: these weights ship ZERO MTP tensors (prod ships 19), so
# the MTP speculative config cannot load at all. MEASURED 2026-07-26 cost of losing it:
# single-stream 67.86 tok/s vs prod 98.59 (-31%); 8-way 258.62 vs 287.47 (-10%).
# The abliteration itself only costs ~10% single-stream; the rest is the missing MTP.
#
# Memory setting left at the prod value (measured ~80G used MTP-off, ample headroom).
# Deliberately NOT re-tuned upward: the GB10 OOM-thrash ceiling is unforgiving and
# there is no BMC on this box, so a bad guess means physical recovery.
#
# Serves as `qwen3.6-35b-a3b:abliterated`. prod-guard has an escape-hatch clause for
# this name. Revert the whole stack with: spark-ops/bin/swap-to-qwen.sh
recipe_version: "1"
name: Qwen3.6-35B-A3B-abliterated-NVFP4-Solo
description: Single-Spark serving of the ABLITERATED Qwen3.6-35B-A3B NVFP4 (marlin MoE, fp8 KV, NO MTP)

# HuggingFace model to download (ungated -- no token required)
model: sakamakismile/Huihui-Qwen3.6-35B-A3B-abliterated-NVFP4

# Container image this config REQUIRES (>=0.25.1 fixes the MTP concurrency deadlock)
container: vllm/vllm-openai:v0.25.1
cluster_only: false
solo_only: true

# Spark-tuned defaults (measured; see header). 0.60 is the GB10 memory ceiling.
defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  gpu_memory_utilization: 0.60
  max_model_len: 262144
  max_num_seqs: 32
  max_num_batched_tokens: 8192

# The vLLM serve command template
command: |
  vllm serve sakamakismile/Huihui-Qwen3.6-35B-A3B-abliterated-NVFP4 \
    --served-model-name qwen3.6-35b-a3b:abliterated \
    --host {host} \
    --port {port} \
    --tensor-parallel-size {tensor_parallel} \
    --trust-remote-code \
    --kv-cache-dtype fp8 \
    --attention-backend flashinfer \
    --moe-backend marlin \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --enable-chunked-prefill \
    --async-scheduling \
    --enable-prefix-caching \
    --load-format fastsafetensors \
    --reasoning-parser qwen3 \
    --tool-call-parser qwen3_xml \
    --enable-auto-tool-choice
