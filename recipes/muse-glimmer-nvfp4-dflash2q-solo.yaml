# Recipe: Muse-Glimmer-30B NVFP4 + NVFP4 (weight-only) DFlash2 drafter — EVAL build (2026-09-09)
#
# Identical to the PROD recipe (muse-glimmer-30b-solo.yaml, salvage tool parser included)
# except: served id, the drafter path, and per-request spec-decode metrics.
# The ONLY variable under test is the drafter checkpoint:
#   Muse-Glimmer-30B-DFlash2        5.54 GB BF16 (prod)
#   Muse-Glimmer-30B-DFlash2-NVFP4  same weights, 5 decoder layers + fc at NVFP4A16
#                                   (built by posttrain/muse/bin/quantize_dflash2_drafter.py)
# vLLM loads the drafter with its OWN quantization_config (get_draft_quant_config) —
# verified in the prod image's qwen3_dflash.py / compressed_tensors.py on 2026-09-09.
# Confirm in the log: no "input_global_scale" in draft weights, drafter layers report
# CompressedTensorsW4A4Fp4 with use_a16.
recipe_version: "1"
name: Muse-Glimmer-30B-NVFP4-DFlash2Q-Solo
description: Muse-Glimmer-30B NVFP4 + NVFP4A16 DFlash2 drafter (weight-only quantized drafter); eval build, 131072 ctx, multimodal
model: /root/.cache/huggingface/local-models/Muse-Glimmer-30B-NVFP4
container: eugr/spark-vllm:20260903-adopted
cluster_only: false
solo_only: true
defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  gpu_memory_utilization: 0.50
  max_model_len: 131072
  max_num_seqs: 32
  max_num_batched_tokens: 8192
command: |
  vllm serve /root/.cache/huggingface/local-models/Muse-Glimmer-30B-NVFP4 \
    --served-model-name muse-dflash2q-eval \
    --host {host} \
    --port {port} \
    --tensor-parallel-size {tensor_parallel} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --enable-chunked-prefill \
    --enable-prefix-caching \
    --generation-config auto \
    --override-generation-config '{{"eos_token_id": [200001]}}' \
    --reasoning-parser muse_glimmer \
    --tool-parser-plugin /root/.cache/huggingface/vllm-plugins/muse_glimmer_salvage_parser.py \
    --tool-call-parser muse_glimmer_salvage \
    --enable-auto-tool-choice \
    --speculative-config '{{"method": "dflash", "model": "/root/.cache/huggingface/local-models/Muse-Glimmer-30B-DFlash2-NVFP4", "num_speculative_tokens": 15}}' \
    --per-request-spec-decode-metrics summary
