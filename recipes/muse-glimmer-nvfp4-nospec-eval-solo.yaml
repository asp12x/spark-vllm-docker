# Recipe: Muse-Glimmer-30B NVFP4, NO speculative decoding -- parity CONTROL (2026-09-05)
# Byte-identical to muse-glimmer-nvfp4-dflash2-solo.yaml minus the --speculative-config
# and spec-metrics lines. Exists so greedy target-only output can be compared token-exact
# against the DFlash2 lane (vllm#54928 method). Served id muse-nospec-eval: no substring
# relation to any prod id.
recipe_version: "1"
name: Muse-Glimmer-30B-NVFP4-NoSpec-Eval-Solo
description: Muse-Glimmer-30B NVFP4 + z-lab/incoai DFlash2 drafter (block-diffusion + local conv + candidate selector; 3B BF16); eval build, 131072 ctx, multimodal
model: /root/.cache/huggingface/local-models/Muse-Glimmer-30B-NVFP4
container: eugr/spark-vllm:20260903-adopted
cluster_only: false
solo_only: true
defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  gpu_memory_utilization: 0.50
  max_model_len: 131072
  max_num_seqs: 32
  max_num_batched_tokens: 8192
command: |
  vllm serve /root/.cache/huggingface/local-models/Muse-Glimmer-30B-NVFP4 \
    --served-model-name muse-nospec-eval \
    --host {host} \
    --port {port} \
    --tensor-parallel-size {tensor_parallel} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --enable-chunked-prefill \
    --enable-prefix-caching \
    --generation-config auto \
    --override-generation-config '{{"eos_token_id": [200001]}}' \
    --reasoning-parser muse_glimmer \
    --tool-call-parser muse_glimmer \
    --enable-auto-tool-choice
