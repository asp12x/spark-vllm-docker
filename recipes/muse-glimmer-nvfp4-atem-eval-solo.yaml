# Recipe: Muse-Glimmer-30B NVFP4 atem — EVAL ARM (Muse ATEM lane; clone of the charops recipe, model dir + served id renamed)
# Our llm-compressor GPTQ-NVFP4 requant (RedHatAI's own recipe, replicated in
# posttrain/muse/bin/requant_muse.py) of the atem-DPO merge. Mirrors the
# PROMOTED prod recipe flag-for-flag — including the official DFlash drafter,
# which is lossless (verify-and-correct) so quality gates measure the model,
# and speed numbers are apples-to-apples with prod. EOS override REQUIRED.
recipe_version: "1"
name: Muse-Glimmer-30B-NVFP4-Atem-Eval
description: NVFP4 requant of the atem merge + DFlash drafter; eval arm, 131072 ctx, multimodal
model: /root/.cache/huggingface/local-models/Muse-Glimmer-30B-NVFP4-atem
container: eugr/spark-vllm:20260903-adopted
cluster_only: false
solo_only: true
defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  gpu_memory_utilization: 0.50
  max_model_len: 131072
  max_num_seqs: 32
  max_num_batched_tokens: 8192
command: |
  vllm serve /root/.cache/huggingface/local-models/Muse-Glimmer-30B-NVFP4-atem \
    --served-model-name muse-atem-eval \
    --host {host} \
    --port {port} \
    --tensor-parallel-size {tensor_parallel} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --enable-chunked-prefill \
    --enable-prefix-caching \
    --generation-config auto \
    --override-generation-config '{{"eos_token_id": [200001]}}' \
    --reasoning-parser muse_glimmer \
    --tool-call-parser muse_glimmer \
    --enable-auto-tool-choice \
    --speculative-config '{{"method": "dflash", "model": "/root/.cache/huggingface/local-models/Muse-Glimmer-30B-assistant", "num_speculative_tokens": 15}}'
