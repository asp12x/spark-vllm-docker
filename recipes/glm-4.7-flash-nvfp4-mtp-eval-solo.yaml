# Recipe: GLM-4.7-Flash NVFP4 + MTP — SOLO / single GB10 — BAKE-OFF, SPECULATIVE ARM
#
# Companion to glm-4.7-flash-nvfp4-eval-solo.yaml. Identical in every respect EXCEPT
# speculative decoding, so the drafter gain stays attributable — same discipline the Muse
# lane used when DFlash was held back to "step 2".
#
# WHY THIS ARM EXISTS. Comparing a bare GLM against prod Muse would be rigged: Muse has five
# promotions of tuning on it (NVFP4 lm_head, DFlash2 drafter at NVFP4 with 15 speculative
# tokens, salvage tool parser). GLM's equivalent lever is MTP, and the checkpoint HAS the head:
# config declares num_nextn_predict_layers 1 and the weight index carries model.layers.47
# (num_hidden_layers is 47, so layers 0-46 are the body and 47 is the nextn head). Verified
# 2026-09-18 against the published index, not assumed.
#
# METHOD NAME: plain "mtp". The prod image deprecates the per-model aliases
# (glm4_moe_lite_mtp etc.) and rewrites them to "mtp", auto-detecting the architecture as
# Glm4MoeLiteMTPModel from the checkpoint's model_type. num_speculative_tokens is 1 because
# checkpoint depth is 1 — asking for more than the head was trained for is the "MTP head must
# match base" trap from the abliterated Qwen3.6 bake-off.
recipe_version: "1"
name: GLM-4.7-Flash-NVFP4-MTP-Eval
description: Bake-off challenger, speculative arm. GLM-4.7-Flash 30B-A3B NVFP4 W4A4 + self-MTP (depth 1), 131072 ctx.
model: GadflyII/GLM-4.7-Flash-NVFP4
container: eugr/spark-vllm:20260911-adopted
cluster_only: false
solo_only: true
defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  gpu_memory_utilization: 0.50
  max_model_len: 131072
  max_num_seqs: 32
  max_num_batched_tokens: 8192
  served_model_name: glm47f-mtp-eval
env:
command: |
  vllm serve GadflyII/GLM-4.7-Flash-NVFP4 \
    --served-model-name {served_model_name} \
    --host {host} \
    --port {port} \
    --tensor-parallel-size {tensor_parallel} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --enable-chunked-prefill \
    --enable-prefix-caching \
    --generation-config auto \
    --reasoning-parser glm45 \
    --tool-call-parser glm47 \
    --enable-auto-tool-choice \
    --speculative-config '{{"method": "mtp", "num_speculative_tokens": 1}}'
